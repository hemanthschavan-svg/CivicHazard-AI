<!DOCTYPE html>
<html>
<head>
<title>Citizen Login | CivicHazard AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#101c32;display:grid;place-items:center;min-height:100vh;margin:0}
.card{background:white;padding:35px;border-radius:12px;width:min(360px,85%)}
input{width:100%;padding:12px;margin:10px 0;box-sizing:border-box}
button{width:100%;padding:13px;background:#ffb52e;border:0;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>Citizen Login</h2>
{% with messages = get_flashed_messages() %}
{% for message in messages %}<p>{{ message }}</p>{% endfor %}
{% endwith %}
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input type="email" name="email" placeholder="Email address" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p>New citizen? <a href="/register">Create account</a></p>
</div>
</body>
</html>
